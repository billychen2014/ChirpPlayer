  <title>啾啾 / ChirpAudio · Docs</title>
  <style>
    :root { color-scheme: light dark; --ink: #1c2422; --muted: #5a6662; --line: #d8ddd9; --bg: #f7f5ef; --card: #fff; --accent: #c9a227; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f2f0ea; --muted: #a8b0ac; --line: #333a37; --bg: #121614; --card: #1a201d; --accent: #e0bc4a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
    .grid { display: grid; gap: 12px; }
    a.card { display: block; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
    a.card:hover { border-color: var(--accent); }
    a.card strong { display: block; font-size: 16px; margin-bottom: 4px; }
    a.card span { font-size: 13px; color: var(--muted); }
    footer { margin-top: 32px; font-size: 13px; color: var(--muted); }
  </style>
</head>

      </a>
      <a class="card" href="support-zh.html">

      </a>
      <a class="card" href="support-en.html">
        <strong>Support (English)</strong>
        <span>产品支持 · 英文</span>
      </a>
    </div>
    <footer>
